backend:
  name: github
  repo: British-Army-Esports/BAES-Website
  branch: main

# Editorial workflow: edits land as a draft + GitHub PR that someone with
# repo write access reviews and merges, rather than going straight to the
# live site. Safer default for an official Army-affiliated public site;
# switch to `publish_mode: simple` later if the review step becomes friction
# once there's a trusted, established set of editors.
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Fixtures and competitions shown on the Events page."
    folder: "src/content/events"
    create: true
    delete: true
    identifier_field: "title"
    slug: "{{slug}}"
    extension: "yaml"
    format: "yaml"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["title", "date"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "e.g. \"EPIC49 (with Intel)\" or \"C.O.D.E. Bowl VII\""

      - label: "Disciplines"
        name: "disciplines"
        widget: "relation"
        collection: "disciplines"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        multiple: true
        required: false
        hint: "Which game(s) this fixture is for. Leave blank for general festival/outreach presence with no fixed game."

      - label: "Corps"
        name: "corps"
        widget: "relation"
        collection: "corps"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Only set this if it's a specific Corps' own team, not a central BAES/UKAF fixture."

      - label: "Scale"
        name: "scale"
        widget: "select"
        hint: "How big/what kind of competition this is — see the label for what each means."
        options:
          - { label: "Engagement — outreach/festival presence, not a formal bracket", value: "engagement" }
          - { label: "Army-Wide — within the Army only (Corps-vs-Corps, unit-level)", value: "single-service" }
          - { label: "Military — UK tri-service, not national/international", value: "military" }
          - { label: "UK National — representing all four home nations", value: "uk-national" }
          - { label: "International Military — against other countries' militaries", value: "international-military" }
          - { label: "European — civilian European-level competition (e.g. FACEIT ESEA)", value: "european" }

      - label: "Team"
        name: "team"
        widget: "select"
        required: false
        hint: "Who actually fielded the team. Leave blank if there's no clean team qualifier (most outreach presences)."
        options:
          - { label: "Corps team (set which Corps above)", value: "corps" }
          - { label: "BAES central team", value: "baes" }
          - { label: "UK Armed Forces (tri-service) team", value: "ukaf" }

      - label: "Presence Type"
        name: "presenceType"
        widget: "select"
        options:
          - { label: "Competitive fixture", value: "competitive" }
          - { label: "Community outreach (festival stand, no formal result)", value: "community-outreach" }
          - { label: "Mixed", value: "mixed" }

      - label: "Row on the Events page"
        name: "tier"
        widget: "select"
        default: "minor"
        hint: "Major = Army Lions/UKAF-level fixtures and large public LAN events (EPIC, Enclave, FACEIT...). Minor = Army-internal competitions (BAEL and similar) and smaller engagement presences (Aldershot, Sunderland...)."
        options:
          - { label: "Major (top row)", value: "major" }
          - { label: "Minor (bottom row)", value: "minor" }

      - label: "Start Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false

      - label: "End Date"
        name: "endDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false
        required: false
        hint: "Only for multi-day events. Leave blank for single-day fixtures."

      - label: "Stream Calendar Tag"
        name: "streamTag"
        widget: "string"
        required: false
        hint: >-
          For long-running seasons/leagues. The start of the matching entries' titles in
          the production stream calendar, e.g. "BAEL F1" matches "BAEL F1 S6". Real stream
          times then come straight from the calendar. The time/days below are the fallback.

      - label: "Stream Time (UK)"
        name: "streamTime"
        widget: "string"
        required: false
        pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Use 24-hour time, e.g. 19:00"]
        hint: >-
          For long-running seasons/leagues only. When streams start, e.g. 19:00.
          The card then says "Stream starts 19:00" / "Streaming now" instead of
          being badged as live all day. Leave blank for one-off events.

      - label: "Stream Days"
        name: "streamDays"
        widget: "select"
        multiple: true
        required: false
        options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        hint: "Which days the season streams. With a time and days set, the card can say \"Next stream Wed 19:00\"."

      - label: "Date Status"
        name: "dateStatus"
        widget: "select"
        default: "confirmed"
        options:
          - { label: "Confirmed", value: "confirmed" }
          - { label: "Provisional — likely but not locked in yet", value: "provisional" }
          - { label: "TBC — date genuinely not known yet", value: "tbc" }

      - label: "Rough Date Options"
        name: "dateOptions"
        widget: "list"
        required: false
        hint: "Only used when Date Status is Provisional, e.g. \"2026-09\". Leave blank otherwise."

      - label: "Format"
        name: "format"
        widget: "select"
        required: false
        hint: "This doesn't change what's saved elsewhere, it's just here to make the next section unambiguous: pick Online and skip Location entirely — do NOT put a Discord server, streaming link, or platform name in Venue Name below. That kind of detail belongs in the Description field further down instead. Venue Name is only ever for a real physical place."
        options:
          - { label: "Online", value: "online" }
          - { label: "In-Person", value: "in-person" }

      - label: "Location — physical venue only, see Format above"
        name: "location"
        widget: "object"
        required: false
        hint: "Leave the whole thing blank if Format above is Online, or if the venue isn't fixed/known yet."
        fields:
          - label: "Venue Name"
            name: "name"
            widget: "string"
            required: false
            hint: "A real physical place only, e.g. \"Blandford Camp, Dorset\" — never a Discord server, URL, or platform name. Leave blank along with Latitude/Longitude if there's no physical venue."
          - label: "Latitude"
            name: "lat"
            widget: "number"
            value_type: "float"
            required: false
            hint: "Optional — if you don't know the exact coordinates, leave both Latitude and Longitude blank. The venue name still shows everywhere on the site; it just won't get a pin on the map without real coordinates."
          - label: "Longitude"
            name: "long"
            widget: "number"
            value_type: "float"
            required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Results Summary"
        name: "resultsSummary"
        widget: "string"
        required: false
        hint: "Only for events that have already happened, e.g. \"British Army Esports: Winners, beat US Navy in the final\"."

      - label: "External Link"
        name: "externalLink"
        widget: "string"
        required: false
        hint: "The event's own official page, if it has one. Leave blank to show a \"more info coming soon\" placeholder instead."

      - label: "Registration Deadline"
        name: "registrationDeadline"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false
        required: false
        hint: "Only if players need to sign up ahead of time. Leave blank if there's no separate registration step."

  # News: fixed "standard" template only — lead photo, text, captioned photo
  # reel. Bigger hand-built ("custom") articles are done in code and are
  # filtered out of this list so the CMS can't flatten their layout.
  # Each article is saved as its own folder (<slug>/index.md) with its photos
  # beside it; the site resizes/compresses those photos at build.
  - name: "news"
    label: "News"
    label_singular: "Article"
    description: >-
      Simple news articles: a lead photo, the story, and a photo reel. For a
      bigger feature with photos placed through the text, send the notes and
      photos to whoever maintains the site instead.
    folder: "src/content/news"
    create: true
    delete: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    filter: { field: "layout", value: "standard" }
    sortable_fields: ["date", "title"]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: "layout", widget: "hidden", default: "standard" }

      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Keep it factual, e.g. \"BAES Lions win BFBS Pro League League of Legends\""

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: true
        time_format: false

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
        hint: "One or two sentences. Shown on the News page and when the link is shared (Discord, X etc.)."

      - label: "Lead photo"
        name: "image"
        widget: "image"
        required: false
        hint: >-
          Shown at the top of the article and used as the preview when the link
          is shared. Landscape works best. Before uploading, check: no one in
          shot who hasn't agreed to be, and no real names visible — gamertags only.

      - label: "Lead photo caption"
        name: "imageCaption"
        widget: "string"
        required: false

      - label: "Article"
        name: "body"
        widget: "markdown"
        modes: ["rich_text"]
        buttons: ["bold", "italic", "link", "heading-two", "bulleted-list", "numbered-list"]
        editor_components: []
        hint: >-
          Short paragraphs. Use a sub-heading to split sections (e.g. one per game).
          Refer to players by gamertag only. Photos go in the reel below, not in
          the text.

      - label: "Photo reel"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        hint: "Shown as a grid under the article; each opens full size. 4–12 is plenty."
        fields:
          - { label: "Photo", name: "src", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }

      - label: "Related event"
        name: "relatedEvent"
        widget: "relation"
        collection: "events"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Links the article to the fixture it's about."

      - label: "Further coverage"
        name: "sources"
        widget: "list"
        required: false
        hint: "Links to other outlets' coverage of the same story."
        fields:
          - { label: "Outlet", name: "label", widget: "string" }
          - { label: "Link", name: "url", widget: "string" }

  # Reference-only collections so the relation fields above can look up real
  # disciplines/Corps. Hidden from the editor's main nav — not meant to be
  # edited here, just to power the dropdowns on the Events form.
  - name: "disciplines"
    label: "Disciplines"
    hide: true
    folder: "src/content/disciplines"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "corps"
    label: "Corps"
    hide: true
    folder: "src/content/corps"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown", required: false }
