[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner flags anything shaped like a Google API key.
  # This one is deliberately public: the stream calendar key in
  # src/lib/streams.ts, restricted in Google Cloud to the Calendar API
  # (read-only) and to this site's domains. Only this exact value is
  # allowed through — scanning stays on for everything else.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyClK8L9GUkWMURh8xo3wm46lv0NDVQof40"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The CMS panel and its config must never be served stale — an editor
# working from a cached copy can hit exactly the kind of "different
# experience to everyone else" bug this is fixing, or worse, save data
# against rules that were already fixed. Static files otherwise have no
# explicit cache policy here, so without this a browser's normal caching
# heuristics are free to hold onto an old admin/index.html or config.yml
# for a while after a new deploy.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
