description: >-
  The BAES Community Tournament is back, where Summoners from across all corps
  will battle it out in the frosty chaos of the Howling Abyss in ARAM mode.


  The ranks will be shuffled and balanced the powers to ensure every match is a thrilling, edge-of-your-seat experience. 


  Fixtures: a five-week round-robin group stage on Wednesdays from 7 October to
  4 November, then best-of-three semi-finals on 11 November and a best-of-five
  grand final on 18 November. All match nights begin from 1900. Group-stage
  scoring: win 3 points, loss 1 point, forfeit -1 point.


  Participation:

  Eligibility: Open to all BAES, RAF, RNVGEA, UVG  members.

  Team Assignment: Players have been assigned to teams to ensure balanced teams.

  Registration is now closed.

  Communication: Platform: BAES LoL Hub Discord server

  Announcements: Regular updates, match schedules, and results will be posted on the Discord server.
